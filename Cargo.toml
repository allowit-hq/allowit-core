[workspace]
members = ["crates/allowit-core"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2024"
repository = "https://github.com/allowit-hq/allowit-core"

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
overflow-checks = true
strip = "symbols"
