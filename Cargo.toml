[workspace]
members = ["crates/allowit"]
default-members = ["."]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2024"
repository = "https://github.com/allowit-hq/allowit-core"

[package]
name = "allowit-sdk"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Shared host primitives for Allowit rail clients and SDK engines"
repository.workspace = true

[lib]
name = "allowit_sdk"
crate-type = ["rlib"]

[[test]]
name = "transport_rpc"
required-features = ["transport"]

[[test]]
name = "policy_source"
required-features = ["policy-source"]

[[test]]
name = "presentation"
required-features = ["policy-source"]

[[example]]
name = "policy_wire"
required-features = ["policy-source"]

[features]
default = ["std"]
std = ["serde/std", "serde_json/std", "sha2/std"]
client = ["std", "dep:libc", "dep:url"]
service = ["std"]
policy-source = ["std", "dep:allowit", "serde/derive"]
transport = ["service", "dep:reqwest"]

[dependencies]
allowit = { path = "crates/allowit", version = "0.3", default-features = false, features = ["std"], optional = true }
serde = { version = "1.0.228", default-features = false, features = ["alloc"] }
serde_json = { version = "1.0.150", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10.9", default-features = false }
libc = { version = "0.2.190", optional = true }
url = { version = "2.5.7", optional = true }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
overflow-checks = true
strip = "symbols"
