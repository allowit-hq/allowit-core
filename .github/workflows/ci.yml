name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --workspace --all-targets
      - run: cargo check --locked -p allowit-sdk --no-default-features --lib
      - name: Install pinned Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz -o /tmp/stellar.tar.gz
          echo 'c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462  /tmp/stellar.tar.gz' | sha256sum -c -
          mkdir /tmp/stellar-cli
          tar -xzf /tmp/stellar.tar.gz -C /tmp/stellar-cli
          echo /tmp/stellar-cli >> "$GITHUB_PATH"
      - run: stellar contract build --locked --package allowit
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s scripts/tests
      - run: cargo fmt --all --check
      - run: rustfmt --edition 2024 --check crates/allowit/src/core.rs
      - run: cargo test --locked -p allowit-sdk --features client,service,transport,policy-source
      - run: cargo clippy --locked -p allowit-sdk --all-targets --features client,service,transport,policy-source -- -D warnings
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Soroban rules and contract-profile doctests
        run: cargo test --locked -p allowit
      - name: Host policy rules and write isolation
        run: cargo test --locked -p allowit --no-default-features --features std
      - run: cargo clippy --locked -p allowit --all-targets -- -D warnings
      - run: cargo clippy --locked -p allowit --no-default-features --features std --all-targets -- -D warnings
