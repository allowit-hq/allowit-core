name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/check_core_boundaries.py
      - run: cargo build --locked --workspace --all-targets
      - run: cargo check --locked -p allowit-core --no-default-features --lib
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s scripts/tests
      - run: cargo fmt --all --check
      - run: rustfmt --edition 2024 --check crates/allowit-core/src/portable/core.rs
      - run: cargo test --locked -p allowit-core --features client,service,transport,policy-source,vendor
      - run: cargo clippy --locked -p allowit-core --all-targets --features client,service,transport,policy-source,vendor -- -D warnings
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Portable rules and doctests
        run: cargo test --locked -p allowit-core
      - name: Host policy rules and write isolation
        run: cargo test --locked -p allowit-core --no-default-features --features std
      - run: cargo clippy --locked -p allowit-core --all-targets -- -D warnings
      - run: cargo clippy --locked -p allowit-core --no-default-features --features std --all-targets -- -D warnings
