name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Check that the tag matches both package versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "$GITHUB_REF_NAME" = "v$(cargo pkgid --offline -p allowit-sdk | sed 's/.*[#@]//')"
          test "$GITHUB_REF_NAME" = "v$(cargo pkgid --offline -p allowit | sed 's/.*[#@]//')"
      - run: cargo test --locked -p allowit
      - run: cargo test --locked -p allowit --no-default-features --features std
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo test --locked -p allowit-sdk --features policy-source
      - run: python3 -m unittest discover -s scripts/tests
