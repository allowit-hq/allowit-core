name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo rustc --locked --release --lib --target wasm32-unknown-unknown --crate-type cdylib
      - run: node tests/test-wasm.mjs
      - run: cargo install --locked cargo-about --version 0.9.2 --features cli
      # The notices cover the crates that the module links: core with its
      # default features, for wasm32-unknown-unknown (.github/about.toml).
      - name: Generate the dependency notices
        run: |
          mkdir -p target/sdk-distribution
          cargo about generate --locked -c .github/about.toml -o target/sdk-distribution/dependency-licenses.html .github/about.hbs
          cp target/wasm32-unknown-unknown/release/allowit_sdk.wasm LICENSE target/sdk-distribution/
      - uses: actions/upload-artifact@v4
        with:
          name: allowit-sdk-wasm
          path: target/sdk-distribution/
