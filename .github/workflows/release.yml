name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Check that the tag matches Rust and npm versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "$GITHUB_REF_NAME" = "v$(cargo pkgid --offline -p allowit-core | sed 's/.*[#@]//')"
          test "$GITHUB_REF_NAME" = "v$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
      - run: node scripts/vendor-boundary.mjs --self-test && node scripts/vendor-boundary.mjs
      - run: cargo test --locked -p allowit-core
      - run: cargo test --locked -p allowit-core --no-default-features --features std
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo test --locked -p allowit-core --features policy-source
      - run: python3 -m unittest discover -s scripts/tests
